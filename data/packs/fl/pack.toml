# Florida state pack: curated places and ZIPs (docs/design.md section 11).
# Provenance, licenses and how to rebuild: docs/packs/fl.md.
#
# places.tsv  name, county, kind (municipality | place), sources, variants
#             (`;`-separated spellings seen in real data, mostly typos)
# zips.tsv    zip, main place, shared places (`;`-separated)
# zips_observed.tsv  zip, place, addresses: more shared places, seen in the
#             DBPR licensee export
# overrides.toml  suffix spellings read differently in Florida (CR = CIRCLE)
#
# places.tsv and zips.tsv are generated by tools/packs/build_fl.py and
# zips_observed.tsv by tools/packs/observe_fl_zips.py; do not edit them by
# hand. overrides.toml is written by hand.

state = "FL"
version = "2026.10.1"
sources = [
  "auction-tracker cities_fl.json (author's own data, MIT OR Apache-2.0)",
  "US Census Bureau 2024 Gazetteer, places (public domain)",
  "GeoNames postal codes, US (CC BY 4.0)",
  "Florida DBPR real estate licensee export, 2025-10-10 (public record)",
]
