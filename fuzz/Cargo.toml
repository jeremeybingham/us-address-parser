[package]
name = "addr-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
addr-core = { path = "../crates/addr-core" }

# Not part of the main workspace: it needs nightly (libFuzzer).
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_fields"
path = "fuzz_targets/parse_fields.rs"
test = false
doc = false
bench = false
