name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Golden corpus accuracy report
        run: cargo test -p addr-core --test corpus -- --nocapture
      - name: Corpus emitter expectations agree with emit_expect.py
        run: python3 tools/corpus/emit_expect.py --check tests/corpus/*.jsonl

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the extension and run the Python tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest usaddress pandas polars
          maturin develop --manifest-path crates/addr-py/Cargo.toml
          pytest crates/addr-py/tests -q
