name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Golden corpus accuracy report
        run: cargo test -p addr-core --test corpus -- --nocapture
      - name: Corpus emitter expectations agree with emit_expect.py
        run: python3 tools/corpus/emit_expect.py --check tests/corpus/*.jsonl

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # rust-toolchain.toml pins stable, so name nightly explicitly.
      - name: Short smoke run of each target
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run parse -- -max_total_time=30 -max_len=200
          cargo +nightly fuzz run parse_fields -- -max_total_time=30 -max_len=200

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the extension and run the Python tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest usaddress pandas polars nbclient nbformat ipykernel
          maturin develop --manifest-path crates/addr-py/Cargo.toml
          pytest crates/addr-py/tests -q
