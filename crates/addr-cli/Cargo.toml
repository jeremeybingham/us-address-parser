[package]
name = "addr-cli"
description = "Command-line tool for the addr US address parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "addr"
path = "src/main.rs"

[dependencies]
addr-core = { path = "../addr-core", features = ["corpus"] }
csv = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
