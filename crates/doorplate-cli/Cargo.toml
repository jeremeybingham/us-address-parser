[package]
name = "doorplate-cli"
description = "Command-line tool for the doorplate US address parser: JSON, USPS and RESO output, a match key, CSV files"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["address", "parser", "usps", "cli", "csv"]
categories = ["command-line-utilities", "text-processing"]
rust-version.workspace = true

[[bin]]
name = "doorplate"
path = "src/main.rs"

# A short alias for `doorplate`: same code, so the two cannot differ.
[[bin]]
name = "addr"
path = "src/bin/addr.rs"

[dependencies]
doorplate = { workspace = true, features = ["corpus"] }
csv = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
