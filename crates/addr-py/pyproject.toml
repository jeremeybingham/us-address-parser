[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "us-address-parser"
description = "Parse US addresses into components; USPS Publication 28 and RESO output, a match key and a slug. Does not validate deliverability."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dynamic = ["version"]
keywords = ["address", "parser", "usps", "reso", "geocoding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
# No runtime dependencies.
dependencies = []

[project.urls]
Repository = "https://github.com/jeremeybingham/us-address-parser"

[tool.maturin]
# The package in python/ re-exports the compiled module us_address_parser._core.
python-source = "python"
module-name = "us_address_parser._core"
# abi3: one wheel per platform for Python 3.10 and later (Cargo.toml).
strip = true
