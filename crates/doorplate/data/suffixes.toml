# suffixes.toml
#
# Street suffixes (street types) and their Postal Service standard abbreviations.
#
# Source: USPS Publication 28, Appendix C1 "Street Suffix Abbreviations".
#   https://pe.usps.com/text/pub28/pub28apc_002.htm
#
# Verified against a copy of the Appendix C1 page (October 2026). The table
# was first transcribed from two open-source copies of C1 (usaddress-scourgify
# and the street-address gem, both MIT); spellings those copies list that the
# current C1 does not are kept as `observed`.
# See docs/usps-pub28-notes.md for the verification status of this table.
#
# Each entry:
#   name     full suffix name (the Appendix C1 primary name; for rows whose
#            primaries include a plural, e.g. PARK / PARKS, the singular)
#   abbr     Postal Service standard suffix abbreviation (what we emit)
#   forms    every spelling Appendix C1 lists for this abbreviation, including
#            the name and the abbreviation itself
#   observed optional; spellings seen in real assessor and listing data that
#            Appendix C1 does not list. Recognized, but flagged in diagnostics
#            as non-standard. Source noted per entry.
#
# Every spelling must map to exactly one abbreviation; build.rs rejects
# duplicates.

