# states.toml
#
# States, the District of Columbia, US possessions and freely associated
# states, and Armed Forces (APO/FPO/DPO) "state" codes, with their two-letter
# USPS abbreviations.
#
# Source: USPS Publication 28, Appendix B "Two-Letter State and Possession
# Abbreviations".
#   https://pe.usps.com/text/pub28/28apb.htm
# Armed Forces codes AA, AE, AP: Appendix B's Military "State" table and
# section 225.1 Military Addresses (https://pe.usps.com/text/pub28/28c2_010.htm).
# See docs/usps-pub28-notes.md for verification status.
#
# Each entry:
#   code     two-letter USPS abbreviation (what we emit)
#   name     full name
#   kind     state | district | territory | freely_associated | military
#   aliases  optional; other spellings seen in input that are NOT USPS codes:
#            traditional (pre-ZIP, GPO-style) abbreviations such as FLA and
#            CALIF, taken from usaddress-scourgify STATE_ABBREVIATIONS (MIT),
#            plus common long forms. Recognized as input only; never emitted.
#
# Short aliases collide with ordinary words (MISS, WASH, ORE, IND, ILL); the
# tagger must only accept them in the state position.

[[state]]
code = "AL"
name = "ALABAMA"
kind = "state"
aliases = ["ALA"]

