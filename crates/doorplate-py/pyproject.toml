[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "doorplate"
description = "Parse US addresses into components; USPS Publication 28 and RESO output, a match key and a slug. Does not validate deliverability."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "Jeremey Bingham", email = "jeremeybingham@gmail.com" }]
dynamic = ["version"]
keywords = ["address", "parser", "usps", "reso", "normalization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
# No runtime dependencies; the dataframe helpers need their own library.
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2"]
polars = ["polars>=1"]

[project.urls]
Homepage = "https://github.com/jeremeybingham/doorplate"
Repository = "https://github.com/jeremeybingham/doorplate"
Documentation = "https://github.com/jeremeybingham/doorplate/blob/main/docs/how-it-works.md"
Issues = "https://github.com/jeremeybingham/doorplate/issues"

[tool.maturin]
# The package in python/ re-exports the compiled module doorplate._core.
python-source = "python"
module-name = "doorplate._core"
# abi3: one wheel per platform for Python 3.10 and later (Cargo.toml).
strip = true
