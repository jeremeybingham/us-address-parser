[package]
name = "doorplate-py"
description = "Python bindings for doorplate (PyO3, built with maturin)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# PyO3 needs a newer compiler than the library (workspace rust-version).
rust-version = "1.83"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]
# The module is loaded by Python, so there is nothing for `cargo test` to run
# or link; the tests are pytest (crates/doorplate-py/tests).
test = false
doctest = false

[lints]
workspace = true

[dependencies]
# rayon: `parse_many` parses in parallel while the GIL is released.
doorplate = { workspace = true, features = ["rayon"] }
# abi3: one wheel per platform for Python 3.10 and later.
pyo3 = { version = "0.30", features = ["abi3-py310"] }
